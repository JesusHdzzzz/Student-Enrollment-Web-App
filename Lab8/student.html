<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Class Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="nav-container">
         <a href="home.html" class="nav-button">View Classes (Home)</a>
         <a href="admin.html" class="nav-button" style="margin-left: 5px;">Admin Page</a>
         </div>

    <div class="container">
        <h1>Student Class Portal</h1>
        <h2>Available Classes</h2>

        <table id="student-class-table">
            <thead>
                <tr>
                    <th>Teacher's Name</th>
                    <th>Students Enrolled</th>
                    <th>Class Time</th>
                    <th>Your Status / Action</th>
                </tr>
            </thead>
            <tbody id="student-class-list">
                <tr>
                    <td colspan="4" style="text-align:center;">Loading classes...</td>
                </tr>
            </tbody>
        </table>
        <p style="font-size: 0.9em; text-align: center; margin-top: 15px;">
            Click "Enroll" to join a class or "Drop" to leave a class you are enrolled in.
        </p>
    </div>

    <script src="student_script.js" defer></script>

</body>
</html>
